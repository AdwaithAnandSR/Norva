<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="nebula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E" />
      <stop offset="40%" stop-color="#7B2CBF" />
      <stop offset="80%" stop-color="#C77DFF" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Background -->
  <rect width="1024" height="1024" fill="transparent"/>

  <!-- Stylized Cosmic 'N' -->
  <path d="M 280 780 L 280 260 L 440 260 L 640 560 L 640 260 L 760 260 L 760 780 L 600 780 L 400 480 L 400 780 Z" 
        fill="url(#nebula)" 
        filter="url(#glow)"/>

  <!-- Central Starburst -->
  <path d="M 520 380 L 535 505 L 660 520 L 535 535 L 520 660 L 505 535 L 380 520 L 505 505 Z" 
        fill="#FFFFFF"/>
        
  <!-- Background Stars -->
  <circle cx="320" cy="350" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="700" cy="650" r="6" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="450" cy="700" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="680" cy="380" r="5" fill="#FFFFFF" opacity="0.7"/>
</svg>
